{% set version = "8.0.0" %}

package:
  name: pyface
  version: {{ version }}

source:
  fn: pyface-{{ version }}.tar.bz2
  url: https://pypi.io/packages/source/p/pyface/pyface-{{ version }}.tar.gz
  sha256: 7e13618347b7a648ed20cdbd4fd1a51648f5010291f35e4e0ff1bf70a720cbf8

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - pip
    - python
    - setuptools >=61
    - wheel
  run:
    - python
    - traits >=6.2
    - importlib-metadata >=3.6  # [py<310]
    - importlib-resources >=1.1.0  # [py<39]

test:
  imports:
    - pyface
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/enthought/pyface
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Traits-capable windowing framework
  description: |
    pyface project contains a toolkit-independent GUI abstraction layer,
    which is used to support the "visualization" features of the Traits
    package.
  doc_url: https://docs.enthought.com/pyface/
  dev_url: https://github.com/enthought/pyface

extra:
  recipe-maintainers:
    - grlee77
